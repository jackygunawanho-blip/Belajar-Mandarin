name: Build Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-noto-cjk
          # 修复 ImageMagick 安全限制（兼容 v6 和 v7）
          if [ -f /etc/ImageMagick-6/policy.xml ]; then sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml; fi
          if [ -f /etc/ImageMagick-7/policy.xml ]; then sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-7/policy.xml; fi

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 生成视频
        run: python water_video.py

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
